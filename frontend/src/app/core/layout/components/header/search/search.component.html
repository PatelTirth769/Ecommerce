<div class="flex w-full items-center bg-white/10 dark:bg-white/5 backdrop-blur-sm border border-white/20 dark:border-white/10 rounded-full overflow-hidden shadow-inner transition-all duration-300 focus-within:border-white/40 focus-within:bg-white/15 dark:focus-within:bg-white/10 focus-within:shadow-lg">
  <!-- Search Icon -->
  <span class="flex-shrink-0 flex items-center pl-4 pr-2 text-white/50 dark:text-white/40">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-4 w-4">
      <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd"/>
    </svg>
  </span>

  <!-- Input -->
  <input
    type="search"
    name="search"
    placeholder="Search products..."
    aria-label="Search"
    class="flex-1 min-w-0 bg-transparent py-2.5 pr-2 text-sm text-white dark:text-white placeholder-white/40 dark:placeholder-white/30 outline-none"
    (keydown)="onKey($event, search)"
    #search
  />

  <!-- Search Button -->
  <button
    type="button"
    (click)="onSearch(search)"
    class="flex-shrink-0 m-1 px-4 py-1.5 bg-white/20 hover:bg-white/30 text-white text-xs font-semibold rounded-full transition-all duration-200 backdrop-blur-sm"
  >
    Search
  </button>
</div>
