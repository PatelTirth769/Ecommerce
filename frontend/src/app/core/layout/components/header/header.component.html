<header class="sticky top-0 z-[100] w-full transition-all duration-300 shadow-md border-b border-white/10">
  <div class="absolute inset-0 bg-gray-900/95 backdrop-blur-md"></div>
  <nav class="relative container mx-auto px-4 md:px-6 lg:px-8">
    <div class="flex items-center gap-3 md:gap-6 h-16 md:h-[72px] w-full">

      <!-- Logo Area (Left) - bigger and prominent -->
      <div class="flex-shrink-0 flex items-center">
        <a routerLink="/" class="group flex items-center cursor-pointer">
          <img src="assets/images/claw-logo-crop.png" alt="Claw"
            style="height: 44px; width: auto; object-fit: contain;"
            class="group-hover:opacity-90 transition-opacity duration-200">
        </a>
      </div>

      <!-- Search Bar (Center - Desktop) -->
      <div class="hidden md:flex flex-1 items-center px-2 lg:px-6">
        <div class="w-full max-w-2xl mx-auto">
          <app-search></app-search>
        </div>
      </div>

      <!-- Desktop Navigation + Icons (Right) -->
      <div class="hidden md:flex flex-shrink-0 items-center gap-4">
        <ul class="flex items-center gap-5">
          <li *ngFor="let menu of menulist">
            <a [routerLink]="[menu.path]" [routerLinkActive]="['text-white', 'font-bold']"
              [routerLinkActiveOptions]="{exact: true}"
              class="text-[13px] font-semibold text-gray-400 hover:text-white transition-colors duration-200 uppercase tracking-wide whitespace-nowrap">
              {{menu.title}}
            </a>
          </li>
        </ul>

        <div class="h-5 w-[1px] bg-white/20"></div>

        <!-- Wishlist -->
        <a [routerLink]="['/wishlist']"
          class="p-2 rounded-full hover:bg-white/10 text-gray-400 hover:text-white transition-all duration-200 relative">
          <i class="fa-regular fa-heart text-lg"></i>
          <span *ngIf="wishlist.length>0"
            class="absolute top-0 right-0 w-4 h-4 bg-blue-500 text-white text-[9px] font-bold flex items-center justify-center rounded-full border-2 border-gray-900">
            {{wishlist.length}}
          </span>
        </a>

        <!-- Cart -->
        <a [routerLink]="['/shopping-cart']"
          class="p-2 rounded-full hover:bg-white/10 text-gray-400 hover:text-white transition-all duration-200 relative">
          <i class="fa-solid fa-bag-shopping text-lg"></i>
          <span *ngIf="cart.length>0"
            class="absolute top-0 right-0 w-4 h-4 bg-blue-500 text-white text-[9px] font-bold flex items-center justify-center rounded-full border-2 border-gray-900">
            {{cart.length}}
          </span>
        </a>

        <!-- Auth -->
        <ng-container *ngIf="!(authService.isLoggedIn$ | async)">
          <a [routerLink]="['/login']"
            class="px-5 py-2 bg-white text-gray-900 text-xs font-bold rounded-full hover:bg-blue-500 hover:text-white transition-all duration-300 shadow-sm whitespace-nowrap">
            Sign In
          </a>
        </ng-container>

        <ng-container *ngIf="(authService.isLoggedIn$ | async)">
          <a [routerLink]="['/profile']"
            class="p-2 rounded-full hover:bg-white/10 text-gray-400 hover:text-white transition-all duration-200">
            <i class="fa-solid fa-user text-lg"></i>
          </a>
          <button (click)="logOut()"
            class="p-2 rounded-full hover:bg-red-500/20 text-gray-400 hover:text-red-400 transition-all duration-200">
            <i class="fa-solid fa-arrow-right-from-bracket text-lg"></i>
          </button>
        </ng-container>
      </div>

      <!-- Mobile Right Actions -->
      <div class="flex md:hidden items-center gap-2 ml-auto">
        <a [routerLink]="['/categories']"
          class="p-1.5 rounded-full hover:bg-white/10 text-gray-400 hover:text-white transition-all duration-200">
          <i class="fa-solid fa-layer-group text-xl"></i>
        </a>
        <a [routerLink]="['/shopping-cart']"
          class="p-1.5 rounded-full hover:bg-white/10 text-gray-400 hover:text-white transition-all duration-200 relative">
          <i class="fa-solid fa-bag-shopping text-xl"></i>
          <span *ngIf="cart.length>0"
            class="absolute -top-1 -right-1 w-4 h-4 bg-blue-500 text-white text-[10px] font-bold flex items-center justify-center rounded-full border-2 border-gray-900">
            {{cart.length}}
          </span>
        </a>
        <button class="p-1.5 text-gray-400 hover:text-white transition-colors" (click)="openMenu()">
          <i class="fa-solid fa-bars-staggered text-xl"></i>
        </button>
      </div>

    </div>

    <!-- Mobile Search Bar -->
    <div class="flex md:hidden pb-3">
      <div class="w-full">
        <app-search></app-search>
      </div>
    </div>
  </nav>

  <!-- Mobile Sidebar Menu -->
  <ng-container *ngIf="isMenu">
    <div class="fixed inset-0 z-[110] bg-black/60 backdrop-blur-sm transition-opacity" (click)="closeMenu()"></div>
    <div class="fixed top-0 right-0 bottom-0 w-[85%] max-w-[320px] z-[120] bg-gray-900 shadow-2xl overflow-y-auto">
      <div class="p-6">
        <div class="flex items-center justify-between mb-8">
          <img src="assets/images/claw-logo-crop.png" alt="Claw" style="height: 40px; width: auto; object-fit: contain;">
          <button (click)="closeMenu()" class="p-2 text-gray-400 hover:text-red-400 transition-colors">
            <i class="fa-solid fa-xmark text-2xl"></i>
          </button>
        </div>

        <ul class="space-y-2">
          <li *ngFor="let menu of menulist">
            <a [routerLink]="[menu.path]" [routerLinkActive]="['bg-white/10', 'text-white']"
              [routerLinkActiveOptions]="{exact: true}"
              class="flex items-center px-4 py-3 rounded-xl text-gray-400 font-semibold hover:bg-white/10 hover:text-white transition-all"
              (click)="closeMenu()">
              {{menu.title}}
            </a>
          </li>
          <li>
            <a [routerLink]="['/shopping-cart']" [routerLinkActive]="['bg-white/10', 'text-white']"
              class="flex items-center justify-between px-4 py-3 rounded-xl text-gray-400 font-semibold hover:bg-white/10 hover:text-white transition-all"
              (click)="closeMenu()">
              <span><i class="fa-solid fa-bag-shopping mr-3"></i>My Cart</span>
              <span *ngIf="cart.length>0"
                class="w-5 h-5 bg-blue-500 text-white text-[10px] font-bold flex items-center justify-center rounded-full">{{cart.length}}</span>
            </a>
          </li>
          <li>
            <a [routerLink]="['/wishlist']" [routerLinkActive]="['bg-white/10', 'text-white']"
              class="flex items-center justify-between px-4 py-3 rounded-xl text-gray-400 font-semibold hover:bg-white/10 hover:text-white transition-all"
              (click)="closeMenu()">
              <span><i class="fa-regular fa-heart mr-3"></i>Wishlist</span>
              <span *ngIf="wishlist.length>0"
                class="w-5 h-5 bg-blue-500 text-white text-[10px] font-bold flex items-center justify-center rounded-full">{{wishlist.length}}</span>
            </a>
          </li>
        </ul>

        <div class="mt-8 pt-8 border-t border-white/10">
          <ng-container *ngIf="!(authService.isLoggedIn$ | async)">
            <a [routerLink]="['/login']" (click)="closeMenu()"
              class="flex items-center justify-center w-full py-4 bg-blue-600 text-white font-bold rounded-2xl shadow-lg">
              Sign In
            </a>
          </ng-container>
          <ng-container *ngIf="(authService.isLoggedIn$ | async)">
            <a [routerLink]="['/profile']" (click)="closeMenu()"
              class="flex items-center justify-center w-full py-4 bg-white/10 text-white font-bold rounded-2xl mb-3">
              My Profile
            </a>
            <button (click)="logOut(); closeMenu()"
              class="flex items-center justify-center w-full py-4 bg-red-500/20 text-red-400 font-bold rounded-2xl">
              Sign Out
            </button>
          </ng-container>
        </div>
      </div>
    </div>
  </ng-container>
</header>
