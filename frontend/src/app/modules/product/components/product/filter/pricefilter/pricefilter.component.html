<div class="mb-2">
  <div class="flex items-center gap-2 px-1 mb-3">
    <i class="fa-solid fa-indian-rupee-sign text-[#3c64a9] text-xs"></i>
    <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400">Price Range</h3>
  </div>
  <div class="px-2">
    <div class="py-1 relative w-full">
      <div class="flex items-center pb-5 justify-between gap-2">
        <div class="w-[90px]">
          <p class="text-[10px] uppercase font-bold text-gray-400 mb-1">Min</p>
          <input 
            type="number" 
            [value]="minVal"
            [step]="step"
            (keyup)="onMinChange($event)"
            class="px-2.5 py-1.5 border border-gray-200 outline-none rounded-lg w-full text-xs font-semibold text-gray-700 focus:border-[#3c64a9] transition-colors"
          >
        </div>
        <span class="text-xs text-gray-400 font-bold mt-4">to</span>
        <div class="w-[90px]">
          <p class="text-[10px] uppercase font-bold text-gray-400 mb-1">Max</p>
          <input 
            type="number" 
            [value]="maxVal"
            [step]="step"
            (keyup)="onMaxChange($event)"
            class="px-2.5 py-1.5 border border-gray-200 outline-none rounded-lg w-full text-xs font-semibold text-gray-700 focus:border-[#3c64a9] transition-colors"
          >
        </div>
      </div>
      
      <div class="relative mt-2 px-1">
        <input 
          type="range"
          step="100"
          id="min"
          [step]="step"
          [max]="max"
          [min]="min"
          (input)="handleMinRange($event)"
          [value]="minVal"
          >
  
        <input 
          type="range" 
          id="max"
          [step]="step"
          [max]="max"
          [min]="min"
          (input)="handleMaxRange($event)"
          [value]="maxVal"
          >
  
        <div class="relative z-10 h-[4px] bg-gray-100 rounded-full">
          <div class="absolute z-10 bottom-0 top-0 rounded-full bg-[#3c64a9]" #progress></div>
        </div>
      </div>
    </div>            
  </div>
</div>
