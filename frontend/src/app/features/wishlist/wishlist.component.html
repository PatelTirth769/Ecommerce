<section class="w-full flex-1 bg-white">
  <article class="mb-5">
    <div class="max-w-[1280px] mx-auto px-4 md:px-6 py-6">

      <h2 class="text-2xl font-bold text-gray-900 mb-6">
        <i class="fa-solid fa-heart text-red-500 mr-2"></i>My Wishlist
      </h2>

      <!-- Loading State -->
      <div class="flex justify-center py-16" *ngIf="isLoading">
        <div class="text-gray-600">
          <i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading wishlist...
        </div>
      </div>

      <!-- Empty State -->
      <div *ngIf="!isLoading && wishlistProducts.length === 0" class="flex flex-col items-center justify-center py-16 text-gray-500">
        <i class="fa-regular fa-heart text-5xl mb-4 text-gray-300"></i>
        <p class="text-sm font-semibold">Your wishlist is empty</p>
        <a routerLink="/product-master" class="mt-4 inline-block bg-gray-900 text-white px-5 py-2.5 rounded-lg text-sm font-bold hover:bg-gray-800 transition-colors">
          Browse Products
        </a>
      </div>

      <!-- Wishlist Grid -->
      <div *ngIf="!isLoading && wishlistProducts.length > 0" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-5">
        <app-productcard *ngFor="let product of wishlistProducts; trackBy: trackByItemCode" [product]="product"></app-productcard>
      </div>

    </div>
  </article>
</section>
